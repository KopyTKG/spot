# Single password prompt: prints the password on Enter, exits 1 on Esc.
#
#   pw=$(spot password.toml) || exit 1
#   pw=$(SPOT_TITLE="sudo" SPOT_FOOTER="for user@host" spot password.toml)

title    = "Password"
anchor   = "center"
width    = 420
style    = "theme.css"
footer   = "Enter to submit · Esc to cancel"
keyboard = "exclusive"

[[items]]
type  = "password"
id    = "pw"
label = "Password"

[submit]
stdout = "{pw}"
