# A run bar: nothing but a search box (docs/launcher.md#a-run-bar). Everything you type
# goes to the default source, a command runner (examples/sources/run.sh, put it on your
# PATH); the results appear under the bar only when there are some (hide_empty).
# ">> htop" is a second source that forces a terminal.
#
#   spot examples/run.toml            (bind it to ALT+F2, say)

title    = ""
anchor   = "top"
margin_top = 160                # 160 px from the top edge (see docs/toml.md#window)
width    = 640
style    = "theme.css"
keyboard = "exclusive"
toggle   = true                 # the key again closes it

[opacity]
outside = 100

[[items]]
type        = "apps"
id          = "run"
placeholder = "Run…   >> htop for a terminal"
hide_empty  = true              # no list until there is something to show

[[sources]]
name     = "run"
default  = true                 # no prefix: everything typed is a command line
icon     = "utilities-terminal"
exec     = "run.sh {query}"
activate = "sh -c {value}"

[[sources]]
name     = "terminal"
prefix   = ">>"
icon     = "utilities-terminal"
exec     = "run.sh {query}"
activate = "xdg-terminal-exec sh -c {value}"
