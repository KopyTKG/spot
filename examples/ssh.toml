title    = "SSH"
anchor   = "center"
width    = 420
style    = "ssh.css"
footer   = "Enter to connect · Esc to cancel"
keyboard = "exclusive"

[[items]]
type = "field"
id = "user"
label = "User"
placeholder = "user"

[[items]]
type = "field"
id = "host"
label = "Host"
placeholder = "host or IP"

[[items]]
type = "field"
id = "port"
label = "Port"
default = "22"

[submit]
# Quoted variables, and "--" so that a value starting with "-" is no option.
exec  = 'setsid -f xdg-terminal-exec ssh -p "$SPOT_VALUE_PORT" -- "$SPOT_VALUE_USER@$SPOT_VALUE_HOST" >/dev/null 2>&1'
spawn = true
