# Included by ../demo.toml: more pages of the same menu.

[page.pages]
title = "Menu pages"

[[page.pages.entry]]
label = '  A page as a grid'
page = 'grid'

[[page.pages.entry]]
label = "  One level deeper"
page = 'deeper'

[[page.pages.entry]]
label = "  A command in a terminal"
terminal = 'echo "Hello from a menu entry"'
hold = true

[page.grid]
title   = "A page as a grid"
columns = 3

[[page.grid.entry]]
label = '  One'
exec = 'true'

[[page.grid.entry]]
label = '  Files'
exec = 'true'

[[page.grid.entry]]
label = '  Settings'
exec = 'true'

[[page.grid.entry]]
label = '  Bookmarks'
exec = 'true'

[[page.grid.entry]]
label = '  Power'
exec = 'true'

[[page.grid.entry]]
label = '  Favourites'
exec = 'true'

[[page.grid.entry]]
label = '  A longer name'
exec = 'true'

[page.deeper]
title = "Deeper"

[[page.deeper.entry]]
label = "  To the bottom"
page = 'bottom'

[page.bottom]
title = "The bottom"

[[page.bottom.entry]]
label = "  Search from the first page finds the bottom too"
exec = 'true'
