# An application launcher: type = "apps" (docs/toml.md#apps).
#
#   spot examples/launcher.toml
#
# Search the installed applications, Enter launches the selected one. How the
# apps are started is the [apps.launch] template, so this is also the place to
# plug in uwsm-app or another wrapper.

title       = ""
anchor      = "top"
width       = 640
style       = "theme.css"
keyboard    = "exclusive"

[opacity]
outside = 100

[[items]]
type        = "apps"
id          = "app"
placeholder = "Search apps…"
height      = 360

[apps]
exclude      = ["*Setup*", "org.kde.kcm_*"]   # hide by desktop id or name
show_comment = true
max_results  = 12
frecency     = true                            # most-launched first, learned over time

[apps.launch]
command  = "{exec}"                            # e.g. "uwsm-app -- {exec}"
terminal = "xdg-terminal-exec {exec}"          # wraps Terminal=true apps

# One app with its own command:
# [[apps.override]]
# id      = "org.mozilla.firefox"
# command = "firefox --new-window"

# --- sources: a prefix hands the search to a command (docs/toml.md#sources) ---------
# "= 2+2" calculates, ". report" finds files, "> htop" runs a command. A source's
# command prints rows as  label[<TAB>value[<TAB>comment]]; Enter runs `activate`.

[[sources]]
name     = "calc"
prefix   = "="
icon     = "accessories-calculator"
exec     = "qalc -t -- {query} | head -n 1"
activate = "wl-copy {value}"

[[sources]]
name     = "files"
prefix   = "."
icon     = "system-file-manager"
exec     = "fd --max-results 40 -- {query} \"$HOME\" | awk '{ print $0 \"\\t\" $0 }'"
activate = "xdg-open {value}"

[[sources]]
name     = "run"
prefix   = ">"
icon     = "utilities-terminal"
exec     = "bash -c 'compgen -c | sort -u | grep -i -m 30 -- \"$0\"' {query}"
activate = "sh -c {value}"
